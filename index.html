<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncing Words - Present Simple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCREEN 1: SETUP -->
  <div id="setup-screen" class="screen active">
    <div class="setup-card">
      <h1>🎯 Bouncing Words</h1>
      <p class="subtitle">Enter your words, correct sentence, and set the movement speed.</p>

      <div class="form-group">
        <label for="input-words">Words (space separated):</label>
        <input type="text" id="input-words" placeholder="e.g. She plays tennis">
      </div>

      <div class="form-group">
        <label for="input-answer">Correct Sentence / Answer:</label>
        <input type="text" id="input-answer" placeholder="e.g. She plays tennis.">
      </div>

      <div class="form-group">
        <label for="select-speed">Movement Speed:</label>
        <select id="select-speed">
          <option value="slow">Slow 🐢</option>
          <option value="normal" selected>Normal 🏃</option>
          <option value="fast">Fast 🚀</option>
        </select>
      </div>

      <div class="setup-actions">
        <button id="btn-start-game" class="btn-primary">START GAME 🎯</button>
        <button id="btn-load-default" class="btn-secondary">Load Default Sentences</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: GAME ARENA -->
  <div id="game-screen" class="screen">
    <header>
      <div class="header-top">
        <h1>🎯 Bouncing Words</h1>
        <span class="info" id="round"></span>
      </div>
      <div class="controls">
        <button id="btn-start">START / STOP</button>
        <button id="btn-answer">SHOW ANSWER</button>
        <button id="btn-next">NEXT →</button>
        <button id="btn-setup" class="btn-secondary">⚙️ Menu</button>
      </div>
    </header>

    <main class="arena" id="arena">
      <div class="center" id="center">
        <div class="big" id="center-title">MAKE A SENTENCE!</div>
        <div class="small" id="center-sub">Watch the words. Stop them and make the sentence.</div>
      </div>
      <div class="answer" id="answer"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
